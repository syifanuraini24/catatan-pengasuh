<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catatan Pengasuh</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f7f4f0; color: #3d3834; font-family: Arial, sans-serif; }
    .app { max-width: 560px; margin: auto; min-height: 100vh; background: #fff; padding: 20px 16px 90px; }
    h1 { font-size: 25px; margin: 0 0 4px; }
    .sub { color: #857c75; font-size: 14px; margin-bottom: 20px; }
    
    .card { background: #faf8f5; border: 1px solid #eee7df; border-radius: 16px; padding: 16px; margin-bottom: 14px; }
    .date { font-weight: bold; font-size: 17px; }
    .status { display: flex; gap: 10px; margin-top: 12px; }
    .timebox { flex: 1; background: #fff; border-radius: 12px; padding: 10px; border: 1px solid #eee7df; }
    .label { font-size: 12px; color: #8b8178; }
    .time { font-weight: bold; margin-top: 4px; }
    
    button { border: 0; border-radius: 12px; padding: 13px 16px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .primary { background: #4d7165; color: white; width: 100%; margin-top: 12px; }
    .secondary { background: #e9eee9; color: #38564d; width: 100%; margin-top: 8px; }
    .row { display: flex; gap: 10px; }
    .row button { flex: 1; }
    
    select, input, textarea { width: 100%; padding: 12px; border: 1px solid #ddd4cc; border-radius: 10px; font-size: 15px; margin-top: 6px; background: #fff; }
    input[type="file"] { padding: 9px; background: #fff; font-size: 13px; }
    textarea { min-height: 80px; resize: vertical; }
    .field { margin-top: 12px; }
    .field label { font-size: 13px; font-weight: bold; }
    
    .timeline { border-left: 2px solid #ddd4cc; margin: 14px 0 0 10px; padding-left: 18px; }
    .item { position: relative; padding: 0 0 18px; }
    .item:before { content: ""; position: absolute; left: -25px; top: 3px; width: 10px; height: 10px; border-radius: 50%; background: #4d7165; }
    .item .top { font-weight: bold; }
    .item .desc { font-size: 14px; color: #716861; margin-top: 4px; line-height: 1.4; white-space: pre-line; }
    .empty { text-align: center; color: #91877f; padding: 20px 5px; }
    .small { font-size: 12px; color: #8b8178; }
    .danger { background: #f3e1dd; color: #8a4034; padding: 7px 10px; font-size: 12px; margin-top: 7px; width: auto; }
  </style>
</head>
<body>
<div class="app">
  <h1>Catatan Pengasuh 👶</h1>
  <div class="sub">Absensi & kegiatan anak hari ini</div>

  <!-- Kartu Absensi -->
  <div class="card">
    <div class="date" id="today"></div>
    <div class="small">Pengasuh: <b id="caregiverName">Teh Dewi</b></div>
    <div class="status">
      <div class="timebox"><div class="label">Absen masuk</div><div class="time" id="inTime">—</div></div>
      <div class="timebox"><div class="label">Absen pulang</div><div class="time" id="outTime">—</div></div>
    </div>
    <div class="row" style="margin-top:12px">
      <button class="primary" onclick="attendance('in')">Absen Masuk</button>
      <button class="secondary" onclick="attendance('out')">Absen Pulang</button>
    </div>
  </div>

  <!-- Kartu Target MPASI -->
  <div class="card">
    <b>Menu MPASI Hari Ini</b>
    <div class="field">
      <input type="text" id="dailyMpasiMenu" placeholder="Contoh: Pagi Bubur Ayam, Sore Buah Naga" onchange="saveMpasiMenu()">
    </div>
  </div>

  <!-- Kartu Tambah Kegiatan -->
  <div class="card">
    <b>Tambah kegiatan</b>
    <div class="row">
      <div class="field" style="flex:1"><label>Jam</label><input type="time" id="activityTime"></div>
      <div class="field" style="flex:2"><label>Kegiatan</label>
        <select id="activityType">
          <option>🥣 Makan (MPASI)</option>
          <option>🍼 Minum Susu</option>
          <option>🧷 Ganti Diaper</option>
          <option>😴 Tidur</option>
          <option>🛁 Mandi</option>
          <option>🧸 Bermain / Aktivitas</option>
          <option>💊 Minum Obat / Vitamin</option>
          <option>📝 Lainnya</option>
        </select>
      </div>
    </div>
    
    <div class="field">
      <label>Foto Kegiatan (Opsional)</label>
      <input type="file" id="photoUpload" accept="image/*" capture="environment">
    </div>

    <div class="field">
      <label>Deskripsi / Keterangan</label>
      <textarea id="description" placeholder="Contoh: Makan habis / Pup warna normal / dll"></textarea>
    </div>
    
    <button class="primary" id="btnSubmit" onclick="addActivity()">Simpan Kegiatan</button>
  </div>

  <!-- Kartu Timeline -->
  <div class="card">
    <b>Kegiatan Hari Ini</b>
    <div id="timeline" class="timeline"></div>
  </div>
</div>

<script>
  const key = 'catatan_pengasuh_v2';
  const todayKey = new Date().toISOString().slice(0, 10);
  const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzRlg--lnS0X9B5ytvp2ci7ZPPb6KNRNMupsHCxlA53u7Z7-ArOo22CYJGOYOzAAYae0g/exec'; 

  document.getElementById('today').textContent = new Date().toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  document.getElementById('activityTime').value = new Date().toTimeString().slice(0, 5);

  function load() {
    const all = JSON.parse(localStorage.getItem(key) || '{}');
    const d = all[todayKey] || { in: null, out: null, mpasi: "", activities: [] };
    
    document.getElementById('inTime').textContent = d.in || '—';
    document.getElementById('outTime').textContent = d.out || '—';
    document.getElementById('dailyMpasiMenu').value = d.mpasi || '';
    
    const el = document.getElementById('timeline');
    if (!d.activities || !d.activities.length) {
      el.innerHTML = '<div class="empty">Belum ada kegiatan hari ini.</div>';
      return;
    }
    
    el.innerHTML = d.activities.slice().sort((a, b) => a.time.localeCompare(b.time)).map((a, i) =>
      `<div class="item">
        <div class="top">${a.time} · ${a.type}</div>
        <div class="desc">${escapeHtml(a.desc || 'Tidak ada deskripsi')}</div>
        <button class="danger" onclick="removeActivity(${i})">Hapus</button>
      </div>`
    ).join('');
  }

  function save(d) {
    const all = JSON.parse(localStorage.getItem(key) || '{}');
    all[todayKey] = d;
    localStorage.setItem(key, JSON.stringify(all));
    load();
  }

  function saveMpasiMenu() {
    const all = JSON.parse(localStorage.getItem(key) || '{}');
    const d = all[todayKey] || { in: null, out: null, mpasi: "", activities: [] };
    d.mpasi = document.getElementById('dailyMpasiMenu').value;
    save(d);
  }

  function sendToSheet(payload) {
    fetch(WEB_APP_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    }).catch(err => console.error('Gagal sinkronisasi:', err));
  }

  function attendance(type) {
    const all = JSON.parse(localStorage.getItem(key) || '{}');
    const d = all[todayKey] || { in: null, out: null, mpasi: "", activities: [] };
    const currentTime = new Date().toTimeString().slice(0, 5);
    
    d[type] = currentTime;
    save(d);
    
    sendToSheet({
      tanggal: todayKey,
      tipe: type === 'in' ? 'Absen Masuk' : 'Absen Pulang',
      jam: currentTime,
      kategori: '-',
      deskripsi: 'Pengasuh melakukan ' + (type === 'in' ? 'absen masuk' : 'absen pulang')
    });
  }

  async function addActivity() {
    const time = document.getElementById('activityTime').value;
    const type = document.getElementById('activityType').value;
    let desc = document.getElementById('description').value.trim();
    const photoInput = document.getElementById('photoUpload');
    const btnSubmit = document.getElementById('btnSubmit');

    if (!time) { alert('Jam belum diisi'); return; }

    btnSubmit.disabled = true;
    btnSubmit.textContent = 'Menyimpan...';

    let photoBase64 = "";
    let photoName = "";
    let mimeType = "";

    try {
      if (photoInput.files.length > 0) {
        const file = photoInput.files[0];
        photoName = file.name;
        mimeType = file.type;
        photoBase64 = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result.split(',')[1]);
          reader.onerror = error => reject(error);
          reader.readAsDataURL(file);
        });
        desc += "\n[ 📸 Foto dilampirkan ]";
      }

      const all = JSON.parse(localStorage.getItem(key) || '{}');
      const d = all[todayKey] || { in: null, out: null, mpasi: "", activities: [] };
      d.activities.push({ time, type, desc });
      save(d);

      sendToSheet({
        tanggal: todayKey,
        tipe: 'Kegiatan Anak',
        jam: time,
        kategori: type,
        deskripsi: desc,
        menuMpasi: document.getElementById('dailyMpasiMenu').value,
        photoBase64: photoBase64,
        photoName: photoName,
        mimeType: mimeType
      });

      document.getElementById('description').value = '';
      photoInput.value = '';

    } catch (e) {
      alert('Gagal memproses foto: ' + e.message);
    } finally {
      btnSubmit.disabled = false;
      btnSubmit.textContent = 'Simpan Kegiatan';
    }
  }

  function removeActivity(index) {
    const all = JSON.parse(localStorage.getItem(key) || '{}');
    const d = all[todayKey];
    if (!d) return;
    const sorted = d.activities.slice().sort((a, b) => a.time.localeCompare(b.time));
    const target = sorted[index];
    d.activities = d.activities.filter(x => x !== target);
    save(d);
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
  }

  load();
</script>
</body>
</html>
